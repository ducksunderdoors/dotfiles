# =============================================================================
# TMUX CONFIG - Jeffery's Multiplexer Configuration
# =============================================================================
# Philosophy: Keyboard-centric, sessions = projects, windows = agents
# Stack: sesh (sessions) + workmux (worktrees/agents) + floax + aven
# Started: February 2026 | Agentic stack: October 2026
# Guide: ~/docs/agentic-tmux/guide.md
# =============================================================================

# -----------------------------------------------------------------------------
# Prefix: Ctrl-a (easier than Ctrl-b)
# -----------------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# =============================================================================
# CORE BEHAVIOR
# =============================================================================

# -----------------------------------------------------------------------------
# Pane Navigation: Vim-style
# -----------------------------------------------------------------------------
# prefix h/j/k/l still works; vim-tmux-navigator (below) adds prefix-less
# Ctrl-h/j/k/l that also moves between Neovim splits.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# -----------------------------------------------------------------------------
# Pane Splitting: Intuitive keys
# -----------------------------------------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %
bind x kill-pane                           # no "kill-pane? (y/n)" prompt

# -----------------------------------------------------------------------------
# Resize panes w/ prefix + H/J/K/L (uppercase, repeatable)
# -----------------------------------------------------------------------------
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# -----------------------------------------------------------------------------
# Windows: Start numbering at 1
# -----------------------------------------------------------------------------
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on                 # no gaps after workmux closes a window

# -----------------------------------------------------------------------------
# Scrollback & History
# -----------------------------------------------------------------------------
set -g history-limit 50000                 # agents are chatty; 50k is fine on 8 GB
set -g mouse on                            # also: click workmux sidebar rows

# -----------------------------------------------------------------------------
# Neovim + Agent CLI Compatibility
# -----------------------------------------------------------------------------
set -sg escape-time 0
set -g default-terminal "tmux-256color"
set -ag terminal-features ",*:RGB"
set -g extended-keys on                    # Shift-Enter newlines in Claude Code / Codex
set -ag terminal-features ",xterm*:extkeys"
set -g focus-events on
set -g allow-passthrough on                # aven image previews through tmux
set -g set-clipboard on

# -----------------------------------------------------------------------------
# Sessions: closing one drops you into another, not out of tmux (sesh)
# -----------------------------------------------------------------------------
set -g detach-on-destroy off

# -----------------------------------------------------------------------------
# Copy Mode: Vi-style
# -----------------------------------------------------------------------------
setw -g mode-keys vi

# -----------------------------------------------------------------------------
# Reload
# -----------------------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# =============================================================================
# AGENTIC STACK
# =============================================================================

# -----------------------------------------------------------------------------
# sesh — sessions = projects
# -----------------------------------------------------------------------------
# prefix T  fuzzy picker: tmux sessions, sesh configs, zoxide dirs, ^f find
bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""
bind -N "last session (sesh)" b run-shell "sesh last"     # L is resize, so b(ack)
bind -N "repo root session (sesh)" R run-shell "sesh connect --root \"#{pane_current_path}\""

# -----------------------------------------------------------------------------
# workmux — windows = worktrees + agents
# -----------------------------------------------------------------------------
bind C-s display-popup -h 80% -w 90% -E "workmux dashboard --session"   # this project
bind C-d display-popup -h 80% -w 90% -E "workmux dashboard"             # every project
bind C-w display-popup -h 80% -w 90% -E "workmux dashboard --tab worktrees"
bind C-t run-shell "workmux sidebar"
bind Tab run-shell "workmux last-agent"    # bounce between two most recent agents
bind A   run-shell "workmux last-done"     # agent that finished / needs you (repeat cycles)
bind N   display-popup -w 80% -h 60% -E -d "#{pane_current_path}" "workmux add -A -e"

# -----------------------------------------------------------------------------
# Popups — aven + lazygit
# -----------------------------------------------------------------------------
bind t display-popup -w 90% -h 85% -E -d "#{pane_current_path}" "aven"
bind g display-popup -w 90% -h 90% -E -d "#{pane_current_path}" "lazygit"

# =============================================================================
# PLUGINS (TPM)  — prefix I install, prefix U update
# =============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'omerxx/tmux-floax'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# -----------------------------------------------------------------------------
# floax — prefix f toggles the floating pane, prefix F opens its menu
# -----------------------------------------------------------------------------
# (default is p, which would steal your previous-window key)
set -g @floax-bind 'f'
set -g @floax-bind-menu 'F'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color '#a277ff'
set -g @floax-text-color '#82e2ff'
set -g @floax-change-path 'true'
set -g @floax-title '  scratch '

run '~/.tmux/plugins/tpm/tpm'

# =============================================================================
# STATUS LINE — Aura palette (matches Ghostty theme = aura)
# =============================================================================
# purple #a277ff  green #61ffca  orange #ffca85  pink #f694ff
# blue   #82e2ff  red   #ff6767  fg     #edecee  muted #6d6d6d  bg #15141b
# bg=default keeps Ghostty's 0.85 opacity showing through.

set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#edecee"
set -g message-style "bg=#15141b,fg=#a277ff"
set -g pane-border-style "fg=#3d375e"
set -g pane-active-border-style "fg=#a277ff"
set -g mode-style "bg=#3d375e,fg=#edecee"

set -g status-left-length 40
set -g status-left "#[fg=#15141b,bg=#a277ff,bold] #S #[bg=default] "

# Window list — includes workmux agent status (🤖 working / 💬 waiting / ✅ done)
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#6d6d6d] #I #W#{?@workmux_status, #{@workmux_status},} "
setw -g window-status-current-format "#[fg=#61ffca,bold] #I #W#{?@workmux_status, #{@workmux_status},}#{?window_zoomed_flag, 󰊓,} "

set -g status-right-length 80
set -g status-right "#{?client_prefix,#[fg=#ffca85 bold] PREFIX ,}#[fg=#6d6d6d] #{b:pane_current_path} #[fg=#82e2ff]%H:%M "

# =============================================================================
# END TMUX CONFIG
# =============================================================================
