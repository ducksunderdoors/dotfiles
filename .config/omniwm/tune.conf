# =============================================================================
# OMNIWM TUNE - changes from OmniWM defaults, applied by `omniwm-tune --apply`
# =============================================================================
# Philosophy: keep AeroSpace muscle memory (Option + hjkl), change little else
# OmniWM's own settings.toml is the source of truth; this file only edits
# values in place. Commit settings.toml to dotfiles once you're happy.
# =============================================================================

# -----------------------------------------------------------------------------
# Focus / move with Option + h/j/k/l  (defaults are Option + arrows)
# -----------------------------------------------------------------------------
bind focus.left   Option+H
bind focus.down   Option+J
bind focus.up     Option+K
bind focus.right  Option+L

bind move.left    Option+Shift+H
bind move.down    Option+Shift+J
bind move.up      Option+Shift+K
bind move.right   Option+Shift+L

# Option+Shift+L was "toggle layout" — move it to Option+/ (AeroSpace's layout key)
bind toggleWorkspaceLayout  Option+Slash

# -----------------------------------------------------------------------------
# Workspaces: Option+Tab = back-and-forth, like AeroSpace
# -----------------------------------------------------------------------------
bind workspaceBackAndForth   Option+Tab
bind focusPrevious           Control+Option+Tab
bind moveWorkspaceToMonitor.right  Option+Shift+Tab

# -----------------------------------------------------------------------------
# Floating (was AeroSpace service-mode f)
# -----------------------------------------------------------------------------
bind toggleFocusedWindowFloating  Option+Shift+Space

# -----------------------------------------------------------------------------
# Quake terminal off — Ghostty's own quick terminal (Cmd+`) stays.
# Saves an embedded terminal's worth of memory on the 8 GB Air.
# -----------------------------------------------------------------------------
bind toggleQuakeTerminal  Unassigned
set  quakeTerminal.enabled  false

# -----------------------------------------------------------------------------
# General
# -----------------------------------------------------------------------------
set general.ipcEnabled  true     # lets omniwmctl work (scripts, tmux, Raycast)
set gaps.size           10.0     # match the old AeroSpace inner gap
